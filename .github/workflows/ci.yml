name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  extended-node:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  browsers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser

  token-boundary:
    name: Verify read-only CI boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify checkout did not retain credentials
        run: |
          if git config --local --get-regexp 'http\..*\.extraheader|credential\.'; then
            echo "::error::Checkout retained a credential configuration"
            exit 1
          fi
      - name: Verify workflow token cannot write repository refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          result=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/heads/mimir-ci-token-probe-$GITHUB_RUN_ID" \
            -f "sha=$GITHUB_SHA" 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::Workflow token unexpectedly wrote a ref; remove the diagnostic branch and restrict permissions"
            exit 1
          fi
          if ! printf '%s' "$result" | grep -q 'HTTP 403'; then
            echo "::error::Write probe failed for an unexpected reason"
            printf '%s\n' "$result"
            exit 1
          fi
          echo "Read-only token verified: repository ref write denied with HTTP 403"
