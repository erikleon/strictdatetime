name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify tag and package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Check whether this version is already on the registry
        id: registry
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          npm view "$name@$version" version >/dev/null 2>&1 && published=true || published=false
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - if: steps.registry.outputs.published == 'false'
        run: npm publish --access public
