name: Publish

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Tag to build and publish, for example v1.2.3.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify tag and package version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: test "$TAG" = "v$(node -p 'require("./package.json").version')"
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Check whether this version is already on the registry
        id: registry
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          npm view "$name@$version" version >/dev/null 2>&1 && published=true || published=false
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - name: Choose the npm dist-tag
        id: disttag
        run: |
          version=$(node -p 'require("./package.json").version')
          case "$version" in
            *-*) echo "name=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "name=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - if: steps.registry.outputs.published == 'false'
        run: npm publish --access public --tag "${{ steps.disttag.outputs.name }}"
